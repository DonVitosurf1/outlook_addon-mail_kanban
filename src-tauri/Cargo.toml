[package]
name = "outlook-kanban-demo"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
mailboard-ollama = { path = "ollama" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-plugin-window-state = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
members = ["ollama"]

# Baut Mail-Board auf einem Windows-Rechner von GitHub: Tests, Outlook-Helfer, Desktop-App und ZIP.
# Jeder Push und jeder Pull Request startet den Bau. Das ZIP hängt am Lauf.
# Ein Push auf main ersetzt zusätzlich das Release „aktuell“, damit der Download-Link im README
# immer auf den neuesten Stand von main zeigt.
name: Windows-Paket

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten
        run: npm ci

      - name: Fachlogik (npm test)
        run: npm test

      - name: Lokales Modellprotokoll (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml -p mailboard-ollama -p mailboard-args

      - name: Outlook-Helfer mit simuliertem Outlook (C#)
        run: dotnet run --project outlook-test/tests/OutlookContracts.csproj

      - name: Outlook-Helfer, Desktop-App und ZIP
        run: npm run portable

      - uses: actions/upload-artifact@v5
        with:
          name: Mail-Board-Windows-x64
          path: downloads/Mail-Board-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Mail-Board-Windows-x64

      - name: Release „aktuell“ ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete aktuell --cleanup-tag --yes || true
          gh release create aktuell Mail-Board-Windows-x64.zip \
            --target "${{ github.sha }}" \
            --title "Mail-Board (aktueller Stand)" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. ZIP entpacken und Mail-Board.exe starten."
